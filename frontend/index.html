<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniResearch Dashboard</title>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        window.mermaid = mermaid;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;padding:20px}
        h1{font-size:1.8em;margin-bottom:20px;color:#38bdf8}
        h2{font-size:1.1em;margin-bottom:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
        .card{background:#1e293b;padding:20px;border-radius:10px;border:1px solid #334155}
        .card-full{grid-column:1/-1}

        .login-bar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
        .login-bar input{padding:6px 12px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:.85em}
        .btn{background:#2563eb;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:.85em}
        .btn:hover{background:#3b82f6}
        .btn-green{background:#16a34a}.btn-green:hover{background:#22c55e}
        .btn-danger{background:#dc2626}.btn-danger:hover{background:#ef4444}
        .btn-sm{padding:4px 10px;font-size:.8em}
        .user-info{color:#4ade80;font-size:.9em}
        .role-badge{padding:2px 8px;border-radius:10px;font-size:.75em;font-weight:600}
        .role-admin{background:#dc2626;color:#fff}

        .agents{display:flex;flex-wrap:wrap;gap:8px}
        .agent-badge{padding:6px 14px;border-radius:20px;font-size:.85em;font-weight:600}
        .agent-idle{background:#475569;color:#cbd5e1}
        .agent-running{background:#d97706;color:#fff;animation:pulse 1.5s infinite}
        .agent-completed{background:#16a34a;color:#fff}
        .agent-failed{background:#dc2626;color:#fff}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

        .dag-container{min-height:250px;display:flex;align-items:center;justify-content:center}
        .dag-placeholder{color:#475569;font-style:italic}

        .timeline{max-height:300px;overflow-y:auto;font-size:.85em;font-family:monospace}
        .timeline-item{padding:4px 0;border-bottom:1px solid #0f172a;display:flex;gap:8px}
        .t-agent{color:#38bdf8;min-width:100px}
        .t-event-started{color:#fbbf24}
        .t-event-completed{color:#4ade80}
        .t-event-failed{color:#f87171}

        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
        .stat-box{background:#0f172a;padding:16px;border-radius:8px;text-align:center}
        .stat-value{font-size:2em;font-weight:700;color:#38bdf8}
        .stat-label{font-size:.8em;color:#64748b;margin-top:4px}

        .admin-bar{display:flex;gap:8px;margin-bottom:12px}
        .admin-bar input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:.9em}

        /* Task Details Panel */
        .task-cards{display:flex;flex-wrap:wrap;gap:8px}
        .task-card{background:#0f172a;padding:10px 14px;border-radius:8px;border:1px solid #334155;cursor:pointer;min-width:120px;transition:border-color .2s}
        .task-card:hover{border-color:#38bdf8}
        .task-card .tc-name{font-weight:600;font-size:.9em;margin-bottom:4px}
        .task-card .tc-status{font-size:.8em;padding:2px 8px;border-radius:4px;display:inline-block}
        .tc-running{background:#92400e;color:#fbbf24}
        .tc-completed{background:#166534;color:#4ade80}
        .tc-failed{background:#991b1b;color:#f87171}
        .tc-idle{background:#334155;color:#94a3b8}
        .tc-retry{font-size:.75em;color:#f59e0b;margin-top:2px}

        /* Modal */
        #taskModal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;max-width:900px;max-height:80vh;background:#1e293b;border:1px solid #475569;border-radius:12px;padding:20px;z-index:1000;overflow:hidden;display:none;flex-direction:column}
        #taskModal.visible{display:flex}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .modal-header h3{color:#38bdf8;font-size:1.1em}
        .modal-close{background:none;border:none;color:#94a3b8;font-size:1.4em;cursor:pointer}
        .modal-close:hover{color:#fff}
        .modal-meta{display:flex;gap:16px;margin-bottom:12px;font-size:.85em}
        .modal-meta span{color:#94a3b8}
        .modal-meta b{color:#e2e8f0}
        .modal-body{flex:1;overflow-y:auto;background:#0f172a;padding:16px;border-radius:8px;font-size:.9em;line-height:1.6}
        .modal-body pre{background:transparent;padding:0}
        .modal-body code{font-size:.85em}
        .modal-pager{display:flex;gap:8px;align-items:center;margin-top:12px;justify-content:center}
        .modal-pager button{background:#334155;color:#e2e8f0;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:.8em}
        .modal-pager button:hover{background:#475569}
        .modal-pager button:disabled{opacity:.4;cursor:default}
        .modal-pager span{color:#94a3b8;font-size:.85em}
        #modalOverlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:999}
        #modalOverlay.visible{display:block}
    </style>
</head>
<body>
    <h1>🐾 OmniResearch Agent</h1>

    <div class="login-bar" id="loginBar">
        <input id="username" placeholder="Username" value="admin">
        <input id="password" type="password" placeholder="Password" value="admin123">
        <button class="btn btn-green" onclick="login()">Login</button>
        <span id="loginStatus"></span>
    </div>
    <div class="login-bar" id="userBar" style="display:none">
        <span class="user-info">Logged in as <b id="currentUser"></b></span>
        <span id="roleBadge" class="role-badge"></span>
        <button class="btn btn-sm btn-danger" onclick="logout()">Logout</button>
    </div>

    <!-- Admin Panel - 放在顶部显眼位置 -->
    <div class="card card-full" id="adminPanel" style="display:none;margin-bottom:16px">
        <div style="display:flex;gap:8px;align-items:center">
            <input id="workflowInput" placeholder="Describe your task..." style="flex:1;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:.95em"/>
            <button class="btn btn-green" onclick="startWorkflow()" style="padding:10px 20px;font-size:1em">▶ Run</button>
        </div>
    </div>

    <div class="card card-full" style="margin-bottom:16px">
        <div class="stats">
            <div class="stat-box"><div class="stat-value" id="statTotal">-</div><div class="stat-label">Total</div></div>
            <div class="stat-box"><div class="stat-value" id="statCompleted" style="color:#4ade80">-</div><div class="stat-label">Completed</div></div>
            <div class="stat-box"><div class="stat-value" id="statRunning" style="color:#fbbf24">-</div><div class="stat-label">Running</div></div>
            <div class="stat-box"><div class="stat-value" id="statDLQ" style="color:#f87171">-</div><div class="stat-label">DLQ</div></div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Agent Status</h2>
            <div class="agents" id="agents"></div>
        </div>
        <div class="card">
            <h2>DAG</h2>
            <div class="dag-container" id="dag">
                <span class="dag-placeholder">Waiting for workflow...</span>
            </div>
        </div>
        <div class="card card-full">
            <h2>Tasks (click to view output)</h2>
            <div class="task-cards" id="taskCards">
                <span style="color:#475569;font-size:.85em">No tasks yet</span>
            </div>
        </div>
        <div class="card card-full">
            <h2>Timeline</h2>
            <div class="timeline" id="timeline"></div>
        </div>

    </div>

    <!-- Modal -->
    <div id="modalOverlay"></div>
    <div id="taskModal">
        <div class="modal-header">
            <h3 id="modalTitle">Task Output</h3>
            <span id="realtimeLabel" style="margin-right:10px;font-size:.8em;color:#38bdf8;display:none">● Live</span>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-meta" id="modalMeta"></div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-pager" style="display:flex;align-items:center;gap:8px">
            <span id="taskStatusBadge" style="font-weight:bold;font-size:.85em"></span>
            <span id="taskProgress" style="font-weight:bold;font-size:.85em;color:#a78bfa"></span>
            <button id="prevPage" onclick="changePage(-1)">◀ Prev</button>
            <span id="pageInfo">Page 1/1</span>
            <button id="nextPage" onclick="changePage(1)">Next ▶</button>
            <input type="text" id="searchInput" placeholder="Search..."
                style="margin-left:10px;padding:4px 8px;border-radius:4px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:.8em;width:140px"/>
            <button onclick="downloadOutput()"
                style="margin-left:6px;background:#334155;color:#e2e8f0;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.8em">
                📥 Save
            </button>
        </div>
    </div>

    <script>
        let token = '', currentRole = '', ws;
        let taskStatus = {};
        let currentTaskId = '';
        let taskModalState = {};

        // Pagination
        const PAGE_SIZE = 1000;
        let outputPages = [];
        let currentPage = 0;

        // Search
        let searchKeyword = '';

        // Real-time refresh
        let refreshInterval = null;

        // ── Auth ───────────────────────────
        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            try {
                const r = await fetch('/auth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ username: u, password: p })
                });
                if (!r.ok) { document.getElementById('loginStatus').textContent = '❌'; return; }
                token = (await r.json()).access_token;
                const me = await (await fetch('/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                })).json();
                currentRole = me.role;
                document.getElementById('loginBar').style.display = 'none';
                document.getElementById('userBar').style.display = 'flex';
                document.getElementById('currentUser').textContent = me.sub;
                const b = document.getElementById('roleBadge');
                b.textContent = currentRole;
                b.className = `role-badge role-${currentRole}`;
                if (currentRole === 'admin') document.getElementById('adminPanel').style.display = 'block';
                // 登录后重连 WebSocket（带 token）
                if (ws) ws.close();
                connectWS();
            } catch (e) { document.getElementById('loginStatus').textContent = '❌ Error'; }
        }
        function logout() {
            token = ''; currentRole = '';
            document.getElementById('loginBar').style.display = 'flex';
            document.getElementById('userBar').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'none';
        }

        // ── WebSocket ──────────────────────
        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const tk = token ? `&access_token=${token}` : '';
            ws = new WebSocket(`${proto}//${location.host}/ws/dashboard?_=${Date.now()}${tk}`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.log) { console.log('[WS]', data.log); }
                if (data.agent_status) updateAgents(data.agent_status);
                if (data.current_dag) updateDAG(data.current_dag);
                if (data.timeline) updateTimeline(data.timeline);
                if (data.task_status) { taskStatus = data.task_status; renderTaskCards(); }
            };
            ws.onclose = () => setTimeout(connectWS, 3000);
        }
        connectWS();

        // ── Agent Status ───────────────────
        function updateAgents(agents) {
            const el = document.getElementById('agents');
            el.innerHTML = '';
            for (const [name, status] of Object.entries(agents)) {
                const b = document.createElement('span');
                b.className = `agent-badge agent-${status}`;
                b.textContent = `${name}: ${status}`;
                el.appendChild(b);
            }
        }

        // ── DAG ────────────────────────────
        let lastDag = '';
        function updateDAG(dag) {
            if (!dag || dag === lastDag) return;
            lastDag = dag;
            const el = document.getElementById('dag');
            el.innerHTML = `<div class="mermaid">${dag}</div>`;
            try {
                window.mermaid.run({ nodes: el.querySelectorAll('.mermaid') }).then(() => {
                    setTimeout(() => {
                        el.querySelectorAll('.node').forEach(node => {
                            const title = node.querySelector('title');
                            if (!title) return;
                            const taskId = title.textContent.trim();
                            node.style.cursor = 'pointer';
                            node.onclick = () => showOutput(taskId);
                        });
                    }, 300);
                });
            } catch (e) {}
        }

        // ── Task Cards ─────────────────────
        function renderTaskCards() {
            const el = document.getElementById('taskCards');
            if (!Object.keys(taskStatus).length) {
                el.innerHTML = '<span style="color:#475569;font-size:.85em">No tasks yet</span>';
                return;
            }
            el.innerHTML = Object.entries(taskStatus).map(([id, info]) => {
                const cls = info.status === 'running' ? 'tc-running'
                    : info.status === 'completed' ? 'tc-completed'
                    : info.status === 'failed' ? 'tc-failed' : 'tc-idle';
                return `<div class="task-card" onclick="showOutput('${id}')">
                    <div class="tc-name">${id}</div>
                    <span class="tc-status ${cls}">${info.status}</span>
                    ${info.retries > 0 ? `<div class="tc-retry">retry: ${info.retries}</div>` : ''}
                    ${info.duration > 0 ? `<div class="tc-retry">${info.duration}s</div>` : ''}
                </div>`;
            }).join('');
        }

        // ── Timeline ───────────────────────
        function updateTimeline(timeline) {
            const el = document.getElementById('timeline');
            el.innerHTML = timeline.slice(-30).reverse().map(t => {
                const cls = t.event?.includes('started') ? 't-event-started'
                    : t.event?.includes('completed') ? 't-event-completed'
                    : t.event?.includes('failed') ? 't-event-failed' : '';
                return `<div class="timeline-item">
                    <span class="t-agent">${t.agent || ''}</span>
                    <span class="${cls}">${t.event || ''}</span>
                </div>`;
            }).join('');
        }

        // ── Modal + Pagination ─────────────
        function showOutput(taskId) {
            currentTaskId = taskId;
            const info = taskStatus[taskId];
            document.getElementById('modalTitle').textContent = `Task: ${taskId}`;

            // Restore saved state
            if (taskModalState[taskId]) {
                currentPage = taskModalState[taskId].currentPage || 0;
                searchKeyword = taskModalState[taskId].searchKeyword || '';
            } else {
                currentPage = 0;
                searchKeyword = '';
            }
            document.getElementById('searchInput').value = searchKeyword;

            if (info) {
                updateModalContent(info);

                // Auto last page for completed/failed
                const status = (info.status || '').toLowerCase();
                if (status === 'completed' || status === 'failed') {
                    currentPage = outputPages.length - 1;
                }
            } else {
                document.getElementById('modalMeta').innerHTML = '<span>No data yet</span>';
                document.getElementById('modalBody').textContent = 'Task has no data yet.';
                outputPages = [];
            }

            renderPage();
            document.getElementById('taskModal').classList.add('visible');
            document.getElementById('modalOverlay').classList.add('visible');

            // Real-time refresh: only for running tasks
            if (refreshInterval) clearInterval(refreshInterval);
            const initialStatus = (taskStatus[taskId]?.status || '').toLowerCase();
            if (initialStatus === 'running') {
                refreshInterval = setInterval(() => {
                    const latest = taskStatus[currentTaskId];
                    if (!latest) return;
                    updateModalContent(latest);

                    // Stop if completed/failed
                    const s = (latest.status || '').toLowerCase();
                    if (s === 'completed' || s === 'failed') {
                        clearInterval(refreshInterval);
                        refreshInterval = null;
                        currentPage = outputPages.length - 1;
                        renderPage();
                    }
                }, 1000);
            }
        }

        function updateModalContent(info) {
            const statusCls = info.status === 'running' ? 'tc-running'
                : info.status === 'completed' ? 'tc-completed'
                : info.status === 'failed' ? 'tc-failed' : 'tc-idle';
            document.getElementById('modalMeta').innerHTML = `
                <span>Status: <b class="tc-status ${statusCls}">${info.status}</b></span>
                <span>Agent: <b>${info.agent || '-'}</b></span>
                <span>Retries: <b>${info.retries}</b></span>
                <span>Duration: <b>${info.duration}s</b></span>
            `;
            const output = info.output || 'No output yet.';
            outputPages = paginate(output);
            renderPage();
        }

        function paginate(text) {
            const pages = [];
            for (let i = 0; i < text.length; i += PAGE_SIZE) {
                pages.push(text.slice(i, i + PAGE_SIZE));
            }
            return pages.length ? pages : [''];
        }

        function renderPage() {
            let content = outputPages[currentPage] || '';

            // Highlight search keyword
            if (searchKeyword) {
                const regex = new RegExp(`(${escapeRegExp(searchKeyword)})`, 'gi');
                content = content.replace(regex, '<mark style="background:#fbbf24;color:#000;padding:1px 2px;border-radius:2px">$1</mark>');
            }

            const body = document.getElementById('modalBody');
            body.innerHTML = marked.parse(content);
            Prism.highlightAllUnder(body);
            document.getElementById('pageInfo').textContent =
                `Page ${currentPage + 1} / ${outputPages.length}`;
            document.getElementById('prevPage').disabled = currentPage <= 0;
            document.getElementById('nextPage').disabled = currentPage >= outputPages.length - 1;

            // Auto scroll to bottom (like terminal)
            if (!searchKeyword) {
                body.scrollTop = body.scrollHeight;
            }

            // Task status badge with emoji
            if (currentTaskId && taskStatus[currentTaskId]) {
                const info = taskStatus[currentTaskId];
                const s = info.status || 'unknown';
                const badge = document.getElementById('taskStatusBadge');
                let label = s.toUpperCase();
                if (s === 'completed') label += ' ✅';
                else if (s === 'failed') label += ' ❌';
                badge.textContent = label;
                badge.style.color = s === 'running' ? '#fbbf24'
                    : s === 'completed' ? '#4ade80'
                    : s === 'failed' ? '#f87171' : '#94a3b8';

                // Realtime label
                const rtLabel = document.getElementById('realtimeLabel');
                rtLabel.style.display = s === 'running' ? 'inline' : 'none';

                // Elapsed time + progress
                const progEl = document.getElementById('taskProgress');
                const startTime = info.startTime || Date.now();
                const progress = info.progress || 0;
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                progEl.textContent = `⏱ ${elapsed}s | ${progress}%`;
            }

            // Save state for this task
            if (currentTaskId) {
                taskModalState[currentTaskId] = {
                    currentPage,
                    searchKeyword,
                    scrollTop: body.scrollTop
                };
            }
        }

        function changePage(delta) {
            const next = currentPage + delta;
            if (next < 0 || next >= outputPages.length) return;
            currentPage = next;
            renderPage();
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('visible');
            document.getElementById('modalOverlay').classList.remove('visible');
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }
        document.getElementById('modalOverlay').onclick = closeModal;

        // Search
        function downloadOutput() {
            if (!outputPages.length) return;
            const fullContent = outputPages.join('\n\n---\n\n');
            const blob = new Blob([fullContent], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentTaskId || 'task'}_output.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.getElementById('searchInput')?.addEventListener('input', (e) => {
            searchKeyword = e.target.value.trim();
            renderPage();
        });

        function escapeRegExp(s) {
            return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // ── Admin ──────────────────────────
        function startWorkflow() {
            if (currentRole !== 'admin') return;
            const desc = document.getElementById('workflowInput').value;
            if (!desc || !ws) return;
            ws.send('start:' + desc);
            document.getElementById('workflowInput').value = '';
        }
        document.getElementById('workflowInput')?.addEventListener('keydown', e => {
            if (e.key === 'Enter') startWorkflow();
        });

        // ── Stats ──────────────────────────
        async function fetchStats() {
            try {
                const d = await (await fetch('/dashboard')).json();
                document.getElementById('statTotal').textContent = d.total_tasks || 0;
                document.getElementById('statCompleted').textContent = d.completed_tasks || 0;
                document.getElementById('statRunning').textContent = d.running_tasks || 0;
                document.getElementById('statDLQ').textContent = d.dlq_count || 0;
                // 同步更新 UI 组件
                if (d.agents) updateAgents(d.agents);
                if (d.current_dag) updateDAG(d.current_dag);
                if (d.timeline) updateTimeline(d.timeline);
                if (d.task_status) { taskStatus = d.task_status; renderTaskCards(); }
            } catch (e) {}
        }
        setInterval(fetchStats, 3000);
        fetchStats();

        /********************************************
         * 九个优化模块 — 可独立启用/禁用
         * 修改 MODULES_ENABLED 对象开关对应功能
         ********************************************/
        const MODULES_ENABLED = {
            sort: true,           // 3. 任务排序/筛选
            searchHistory: true,  // 4. 搜索历史
            virtualScroll: true,  // 5. 虚拟滚动
            multiTask: true,      // 6. 多任务切换
            websocket: false,     // 7. WebSocket 增强（默认关闭，需配置）
            chart: true,          // 8. 进度图表
            exportPDF: true       // 9. 导出 PDF
        };

        // ── 模块 3: 任务排序/筛选 ──────────
        const SortModule = {
            enabled: MODULES_ENABLED.sort,
            init() {
                if (!this.enabled) return;
                // 在 modal-pager 区域添加排序按钮
                const pager = document.querySelector('.modal-pager');
                if (pager && !document.getElementById('sortToggle')) {
                    const btn = document.createElement('button');
                    btn.id = 'sortToggle';
                    btn.textContent = '🔀 Sort';
                    btn.style.cssText = 'background:#334155;color:#e2e8f0;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.8em';
                    btn.onclick = () => this.togglePanel();
                    pager.appendChild(btn);
                }
            },
            togglePanel() {
                let panel = document.getElementById('sortPanel');
                if (!panel) {
                    panel = document.createElement('div');
                    panel.id = 'sortPanel';
                    panel.style.cssText = 'background:#0f172a;padding:12px;border-radius:6px;margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap';
                    panel.innerHTML = `
                        <select id="sortField" style="padding:4px;border-radius:4px;background:#1e293b;color:#e2e8f0;border:1px solid #475569">
                            <option value="status">Status</option>
                            <option value="name">Name</option>
                            <option value="duration">Duration</option>
                        </select>
                        <select id="sortOrder" style="padding:4px;border-radius:4px;background:#1e293b;color:#e2e8f0;border:1px solid #475569">
                            <option value="asc">Asc</option>
                            <option value="desc">Desc</option>
                        </select>
                        <select id="filterStatus" style="padding:4px;border-radius:4px;background:#1e293b;color:#e2e8f0;border:1px solid #475569">
                            <option value="all">All</option>
                            <option value="running">Running</option>
                            <option value="completed">Completed</option>
                            <option value="failed">Failed</option>
                        </select>
                        <button onclick="SortModule.apply()" style="background:#2563eb;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer">Apply</button>
                    `;
                    document.getElementById('taskModal').appendChild(panel);
                }
                panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
            },
            apply() {
                const field = document.getElementById('sortField').value;
                const order = document.getElementById('sortOrder').value;
                const filter = document.getElementById('filterStatus').value;
                // 排序逻辑应用于 taskStatus
                const entries = Object.entries(taskStatus);
                let filtered = filter === 'all' ? entries : entries.filter(([_, t]) => (t.status || '').toLowerCase() === filter);
                filtered.sort(([idA, a], [idB, b]) => {
                    let va, vb;
                    if (field === 'status') { va = a.status || ''; vb = b.status || ''; }
                    else if (field === 'name') { va = idA; vb = idB; }
                    else if (field === 'duration') { va = a.duration || 0; vb = b.duration || 0; }
                    const cmp = va < vb ? -1 : va > vb ? 1 : 0;
                    return order === 'asc' ? cmp : -cmp;
                });
                renderTaskCards();
                console.log('[Sort] Applied:', field, order, filter);
            }
        };

        // ── 模块 4: 搜索历史 ──────────────
        const SearchHistoryModule = {
            enabled: MODULES_ENABLED.searchHistory,
            storageKey: 'omniresearch_search_history',
            maxHistory: 20,
            history: [],
            init() {
                if (!this.enabled) return;
                this.load();
                const input = document.getElementById('searchInput');
                if (input) {
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && searchKeyword) {
                            this.add(searchKeyword);
                        }
                    });
                    // 双击显示历史
                    input.addEventListener('dblclick', () => this.showPanel());
                }
            },
            load() {
                try { this.history = JSON.parse(localStorage.getItem(this.storageKey) || '[]'); } catch { this.history = []; }
            },
            save() {
                localStorage.setItem(this.storageKey, JSON.stringify(this.history));
            },
            add(keyword) {
                if (!keyword.trim()) return;
                this.history = [keyword, ...this.history.filter(k => k !== keyword)].slice(0, this.maxHistory);
                this.save();
            },
            showPanel() {
                let panel = document.getElementById('searchHistoryPanel');
                if (!panel) {
                    panel = document.createElement('div');
                    panel.id = 'searchHistoryPanel';
                    panel.style.cssText = 'position:absolute;background:#1e293b;border:1px solid #475569;border-radius:6px;padding:8px;max-height:200px;overflow-y:auto;z-index:1001;min-width:200px';
                    document.getElementById('searchInput').parentNode.style.position = 'relative';
                    document.getElementById('searchInput').parentNode.appendChild(panel);
                }
                panel.innerHTML = this.history.map(k =>
                    `<div style="padding:4px 8px;cursor:pointer;border-radius:4px;font-size:.85em" onmouseover="this.style.background='#334155'" onmouseout="this.style.background='transparent'" onclick="document.getElementById('searchInput').value='${k}';searchKeyword='${k}';renderPage();document.getElementById('searchHistoryPanel').style.display='none'">${k}</div>`
                ).join('') || '<div style="color:#475569;font-size:.85em">No history</div>';
                panel.style.display = panel.style.display === 'none' ? 'block' : 'block';
            }
        };

        // ── 模块 5: 虚拟滚动 ──────────────
        const VirtualScrollModule = {
            enabled: MODULES_ENABLED.virtualScroll,
            active: false,
            lineHeight: 20,
            init() {
                if (!this.enabled) return;
                const pager = document.querySelector('.modal-pager');
                if (pager && !document.getElementById('virtualToggle')) {
                    const btn = document.createElement('button');
                    btn.id = 'virtualToggle';
                    btn.textContent = '⚡ Virtual';
                    btn.style.cssText = 'background:#334155;color:#e2e8f0;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.8em';
                    btn.onclick = () => this.toggle();
                    pager.appendChild(btn);
                }
            },
            toggle() {
                this.active = !this.active;
                document.getElementById('virtualToggle').style.background = this.active ? '#2563eb' : '#334155';
                renderPage();
            },
            render(content) {
                const body = document.getElementById('modalBody');
                const lines = content.split('\n');
                const totalHeight = lines.length * this.lineHeight;
                body.innerHTML = `<div style="height:${totalHeight}px;position:relative"></div>`;
                const container = body.querySelector('div');
                const scrollTop = body.scrollTop;
                const viewHeight = body.clientHeight;
                const startIdx = Math.floor(scrollTop / this.lineHeight);
                const endIdx = Math.min(lines.length, startIdx + Math.ceil(viewHeight / this.lineHeight) + 5);
                for (let i = startIdx; i < endIdx; i++) {
                    const div = document.createElement('div');
                    div.style.cssText = `position:absolute;top:${i * this.lineHeight}px;left:0;right:0;white-space:pre-wrap`;
                    div.textContent = lines[i] || '';
                    container.appendChild(div);
                }
                body.onscroll = () => this.render(content);
            }
        };

        // ── 模块 6: 多任务切换 ──────────────
        const MultiTaskModule = {
            enabled: MODULES_ENABLED.multiTask,
            init() {
                if (!this.enabled) return;
                // 点击 taskCard 时已自动调用 showOutput，无需额外处理
                // 添加快速切换快捷键
                document.addEventListener('keydown', (e) => {
                    if (!document.getElementById('taskModal').classList.contains('visible')) return;
                    if (e.altKey && e.key === 'ArrowRight') this.nextTask();
                    if (e.altKey && e.key === 'ArrowLeft') this.prevTask();
                });
            },
            getTaskIds() { return Object.keys(taskStatus); },
            nextTask() {
                const ids = this.getTaskIds();
                const idx = ids.indexOf(currentTaskId);
                if (idx >= 0 && idx < ids.length - 1) showOutput(ids[idx + 1]);
            },
            prevTask() {
                const ids = this.getTaskIds();
                const idx = ids.indexOf(currentTaskId);
                if (idx > 0) showOutput(ids[idx - 1]);
            }
        };

        // ── 模块 7: WebSocket 增强 ──────────
        const WebSocketEnhancedModule = {
            enabled: MODULES_ENABLED.websocket,
            reconnectAttempts: 0,
            maxReconnect: 10,
            init() {
                if (!this.enabled) return;
                // 增强现有 WebSocket 连接
                // 可在此添加心跳、重连策略等
                console.log('[WS-Enhanced] Module loaded (configurable)');
            }
        };

        // ── 模块 8: 进度图表 ──────────────
        const ChartModule = {
            enabled: MODULES_ENABLED.chart,
            history: [],
            init() {
                if (!this.enabled) return;
                const pager = document.querySelector('.modal-pager');
                if (pager && !document.getElementById('chartToggle')) {
                    const btn = document.createElement('button');
                    btn.id = 'chartToggle';
                    btn.textContent = '📊 Chart';
                    btn.style.cssText = 'background:#334155;color:#e2e8f0;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.8em';
                    btn.onclick = () => this.toggle();
                    pager.appendChild(btn);
                }
            },
            record(progress) {
                this.history.push({ time: Date.now(), progress });
                if (this.history.length > 100) this.history.shift();
            },
            toggle() {
                let panel = document.getElementById('chartPanel');
                if (!panel) {
                    panel = document.createElement('div');
                    panel.id = 'chartPanel';
                    panel.style.cssText = 'background:#0f172a;padding:12px;border-radius:6px;margin-top:8px';
                    panel.innerHTML = '<canvas id="progressChart" width="800" height="150"></canvas>';
                    document.getElementById('taskModal').appendChild(panel);
                }
                panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
                if (panel.style.display === 'block') this.draw();
            },
            draw() {
                const canvas = document.getElementById('progressChart');
                if (!canvas || this.history.length < 2) return;
                const ctx = canvas.getContext('2d');
                const w = canvas.width, h = canvas.height;
                ctx.clearRect(0, 0, w, h);
                // Grid
                ctx.strokeStyle = '#334155';
                for (let i = 0; i <= 4; i++) {
                    const y = h - (h * i / 4);
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
                }
                // Line
                const maxT = this.history[this.history.length - 1].time;
                const minT = this.history[0].time;
                const range = maxT - minT || 1;
                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.beginPath();
                this.history.forEach((p, i) => {
                    const x = ((p.time - minT) / range) * w;
                    const y = h - (p.progress / 100) * h;
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                });
                ctx.stroke();
                // Dot
                const last = this.history[this.history.length - 1];
                const lx = w, ly = h - (last.progress / 100) * h;
                ctx.fillStyle = '#f87171'; ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#e2e8f0'; ctx.font = '12px sans-serif'; ctx.fillText(last.progress + '%', lx - 30, ly - 8);
            }
        };

        // ── 模块 9: 导出 PDF ──────────────
        const ExportModule = {
            enabled: MODULES_ENABLED.exportPDF,
            init() {
                if (!this.enabled) return;
                const pager = document.querySelector('.modal-pager');
                if (pager && !document.getElementById('pdfBtn')) {
                    const btn = document.createElement('button');
                    btn.id = 'pdfBtn';
                    btn.textContent = '📄 PDF';
                    btn.style.cssText = 'background:#334155;color:#e2e8f0;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.8em';
                    btn.onclick = () => this.exportPDF();
                    pager.appendChild(btn);
                }
            },
            exportPDF() {
                if (!this.enabled) return;
                const content = document.getElementById('modalBody').innerHTML;
                const win = window.open('', '_blank');
                win.document.write(`
                    <html><head><title>${currentTaskId} - Export</title>
                    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.css" rel="stylesheet"/>
                    <style>body{font-family:monospace;padding:20px;white-space:pre-wrap;background:#1e293b;color:#e2e8f0}</style>
                    </head><body>${content}</body></html>
                `);
                win.document.close();
                win.print();
            }
        };

        // ── 初始化所有模块 ─────────────────
        function initModules() {
            SortModule.init();
            SearchHistoryModule.init();
            VirtualScrollModule.init();
            MultiTaskModule.init();
            WebSocketEnhancedModule.init();
            ChartModule.init();
            ExportModule.init();
            console.log('[Modules] All 9 modules initialized');
        }
        initModules();
    </script>
</body>
</html>
