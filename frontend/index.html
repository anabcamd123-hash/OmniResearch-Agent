<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniResearch Workflow Dashboard</title>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        window.mermaid = mermaid;
    </script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;padding:20px}
        h1{font-size:1.8em;margin-bottom:20px;color:#38bdf8}
        h2{font-size:1.1em;margin-bottom:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
        .card{background:#1e293b;padding:20px;border-radius:10px;border:1px solid #334155}
        .card-full{grid-column:1/-1}

        /* Login */
        .login-bar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
        .login-bar input{padding:6px 12px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:.85em}
        .btn{background:#2563eb;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:.85em}
        .btn:hover{background:#3b82f6}
        .btn-green{background:#16a34a}.btn-green:hover{background:#22c55e}
        .btn-danger{background:#dc2626}.btn-danger:hover{background:#ef4444}
        .btn-sm{padding:4px 10px;font-size:.8em}
        .user-info{color:#4ade80;font-size:.9em}
        .role-badge{padding:2px 8px;border-radius:10px;font-size:.75em;font-weight:600}
        .role-admin{background:#dc2626;color:#fff}

        /* Agents */
        .agents{display:flex;flex-wrap:wrap;gap:8px}
        .agent-badge{padding:6px 14px;border-radius:20px;font-size:.85em;font-weight:600}
        .agent-idle{background:#475569;color:#cbd5e1}
        .agent-running{background:#d97706;color:#fff;animation:pulse 1.5s infinite}
        .agent-completed{background:#16a34a;color:#fff}
        .agent-failed{background:#dc2626;color:#fff}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

        /* DAG */
        .dag-container{min-height:200px;display:flex;align-items:center;justify-content:center}
        .dag-placeholder{color:#475569;font-style:italic}

        /* Timeline */
        .timeline{max-height:400px;overflow-y:auto;font-size:.85em;font-family:monospace}
        .timeline-item{padding:4px 0;border-bottom:1px solid #0f172a;display:flex;gap:8px}
        .t-agent{color:#38bdf8;min-width:100px}
        .t-event{color:#94a3b8}
        .t-event-started{color:#fbbf24}
        .t-event-completed{color:#4ade80}
        .t-event-failed{color:#f87171}

        /* Stats */
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
        .stat-box{background:#0f172a;padding:16px;border-radius:8px;text-align:center}
        .stat-value{font-size:2em;font-weight:700;color:#38bdf8}
        .stat-label{font-size:.8em;color:#64748b;margin-top:4px}

        /* Admin */
        .admin-bar{display:flex;gap:8px;margin-bottom:12px}
        .admin-bar input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:.9em}
    </style>
</head>
<body>
    <h1>🐾 OmniResearch Agent</h1>

    <!-- Login -->
    <div class="login-bar" id="loginBar">
        <input id="username" placeholder="Username" value="admin">
        <input id="password" type="password" placeholder="Password" value="admin123">
        <button class="btn btn-green" onclick="login()">Login</button>
        <span id="loginStatus"></span>
    </div>
    <div class="login-bar" id="userBar" style="display:none">
        <span class="user-info">Logged in as <b id="currentUser"></b></span>
        <span id="roleBadge" class="role-badge"></span>
        <button class="btn btn-sm btn-danger" onclick="logout()">Logout</button>
    </div>

    <!-- Stats -->
    <div class="card card-full" style="margin-bottom:16px">
        <div class="stats">
            <div class="stat-box"><div class="stat-value" id="statTotal">-</div><div class="stat-label">Total</div></div>
            <div class="stat-box"><div class="stat-value" id="statCompleted" style="color:#4ade80">-</div><div class="stat-label">Completed</div></div>
            <div class="stat-box"><div class="stat-value" id="statRunning" style="color:#fbbf24">-</div><div class="stat-label">Running</div></div>
            <div class="stat-box"><div class="stat-value" id="statDLQ" style="color:#f87171">-</div><div class="stat-label">DLQ</div></div>
        </div>
    </div>

    <div class="grid">
        <!-- Agent Status -->
        <div class="card">
            <h2>Agent Status</h2>
            <div class="agents" id="agents"></div>
        </div>

        <!-- DAG -->
        <div class="card">
            <h2>DAG Workflow</h2>
            <div class="dag-container" id="dag">
                <span class="dag-placeholder">Waiting for workflow...</span>
            </div>
        </div>

        <!-- Timeline -->
        <div class="card">
            <h2>Timeline</h2>
            <div class="timeline" id="timeline"></div>
        </div>

        <!-- Admin -->
        <div class="card" id="adminPanel" style="display:none">
            <h2>Start Workflow</h2>
            <div class="admin-bar">
                <input id="workflowInput" placeholder="Describe your task..."/>
                <button class="btn btn-green" onclick="startWorkflow()">▶ Run</button>
            </div>
        </div>
    </div>

    <script>
        let token = '', currentRole = '', ws;

        // ── Auth ───────────────────────────
        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            try {
                const r = await fetch('/auth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ username: u, password: p })
                });
                if (!r.ok) { document.getElementById('loginStatus').textContent = '❌'; return; }
                token = (await r.json()).access_token;
                const me = await (await fetch('/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                })).json();
                currentRole = me.role;
                document.getElementById('loginBar').style.display = 'none';
                document.getElementById('userBar').style.display = 'flex';
                document.getElementById('currentUser').textContent = me.sub;
                const b = document.getElementById('roleBadge');
                b.textContent = currentRole;
                b.className = `role-badge role-${currentRole}`;
                if (currentRole === 'admin') document.getElementById('adminPanel').style.display = 'block';
            } catch (e) { document.getElementById('loginStatus').textContent = '❌ Error'; }
        }
        function logout() {
            token = ''; currentRole = '';
            document.getElementById('loginBar').style.display = 'flex';
            document.getElementById('userBar').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'none';
        }

        // ── WebSocket ──────────────────────
        function connectWS() {
            ws = new WebSocket(`ws://${location.host}/ws/workflows`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.agent_status) updateAgents(data.agent_status);
                if (data.current_dag) updateDAG(data.current_dag);
                if (data.timeline) updateTimeline(data.timeline);
            };
            ws.onclose = () => setTimeout(connectWS, 3000);
        }
        connectWS();

        // ── Agent Status ───────────────────
        function updateAgents(agents) {
            const el = document.getElementById('agents');
            el.innerHTML = '';
            for (const [name, status] of Object.entries(agents)) {
                const b = document.createElement('span');
                b.className = `agent-badge agent-${status}`;
                b.textContent = `${name}: ${status}`;
                el.appendChild(b);
            }
        }

        // ── DAG (Mermaid) ──────────────────
        let lastDag = '';
        function updateDAG(dag) {
            if (!dag || dag === lastDag) return;
            lastDag = dag;
            const el = document.getElementById('dag');
            el.innerHTML = `<div class="mermaid">${dag}</div>`;
            try { window.mermaid.run({ nodes: el.querySelectorAll('.mermaid') }); } catch (e) {}
        }

        // ── Timeline ───────────────────────
        function updateTimeline(timeline) {
            const el = document.getElementById('timeline');
            el.innerHTML = timeline.slice(-30).reverse().map(t => {
                const cls = t.event?.includes('started') ? 't-event-started'
                    : t.event?.includes('completed') ? 't-event-completed'
                    : t.event?.includes('failed') ? 't-event-failed'
                    : 't-event';
                return `<div class="timeline-item">
                    <span class="t-agent">${t.agent || ''}</span>
                    <span class="${cls}">${t.event || ''}</span>
                </div>`;
            }).join('');
        }

        // ── Admin: Start Workflow ──────────
        function startWorkflow() {
            if (currentRole !== 'admin') return;
            const desc = document.getElementById('workflowInput').value;
            if (!desc || !ws) return;
            ws.send('start:' + desc);
            document.getElementById('workflowInput').value = '';
        }
        document.getElementById('workflowInput')?.addEventListener('keydown', e => {
            if (e.key === 'Enter') startWorkflow();
        });

        // ── Stats ──────────────────────────
        async function fetchStats() {
            try {
                const d = await (await fetch('/dashboard')).json();
                document.getElementById('statTotal').textContent = d.total_tasks || 0;
                document.getElementById('statCompleted').textContent = d.completed_tasks || 0;
                document.getElementById('statRunning').textContent = d.running_tasks || 0;
                document.getElementById('statDLQ').textContent = d.dlq_count || 0;
            } catch (e) {}
        }
        setInterval(fetchStats, 3000);
        fetchStats();
    </script>
</body>
</html>
