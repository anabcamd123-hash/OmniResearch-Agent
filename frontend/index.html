<!DOCTYPE html>
<html>

<head>

    <title>OmniResearch Dashboard</title>

    <style>

        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        #logs {
            height: 400px;
            overflow-y: scroll;
            background: black;
            padding: 10px;
        }

        #history {
            max-height: 300px;
            overflow-y: auto;
        }

        .timeline-item {
            padding: 4px 0;
            border-bottom: 1px solid #334155;
        }

        .timeline-item .started {
            color: #38bdf8;
        }

        .timeline-item .completed {
            color: #4ade80;
        }

        .timeline-item .failed {
            color: #f87171;
        }

    </style>

    <script type="module">
        import mermaid from
        'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        mermaid.initialize({
            startOnLoad: true,
            theme: 'dark'
        });

        window.mermaid = mermaid;
    </script>

</head>

<body>

    <h1>OmniResearch Dashboard</h1>

    <div class="card">

        <h2>Runtime Metrics</h2>

        <p id="totalTasks"></p>

        <p id="completedTasks"></p>

        <p id="runningTasks"></p>

        <p id="tokenUsage"></p>

    </div>

    <div class="card">

        <h2>Agent Status</h2>

        <pre id="agents"></pre>

    </div>

    <div class="card">

        <h2>DAG Workflow</h2>

        <div id="dag" class="mermaid">
graph TD
    Loading...
        </div>

    </div>

    <div class="card">

        <h2>Task History</h2>

        <pre id="history"></pre>

    </div>

    <div class="card">

        <h2>Agent Timeline</h2>

        <div id="timeline"></div>

    </div>

    <div class="card">

        <h2>Live Logs</h2>

        <div id="logs"></div>

    </div>

    <script>

        const logs = document.getElementById("logs")

        const ws = new WebSocket(
            "ws://127.0.0.1:8000/ws/logs"
        )

        ws.onmessage = (event) => {

            const div = document.createElement("div")

            div.innerText = event.data

            logs.appendChild(div)

            logs.scrollTop = logs.scrollHeight
        }

        async function updateDashboard() {

            const res = await fetch(
                "http://127.0.0.1:8000/dashboard"
            )

            const data = await res.json()

            document.getElementById(
                "totalTasks"
            ).innerText =
                "Total Tasks: " + data.total_tasks

            document.getElementById(
                "completedTasks"
            ).innerText =
                "Completed: " + data.completed_tasks

            document.getElementById(
                "runningTasks"
            ).innerText =
                "Running: " + data.running_tasks

            document.getElementById(
                "tokenUsage"
            ).innerText =
                "Tokens: " + data.token_usage

            document.getElementById(
                "agents"
            ).innerText =
                JSON.stringify(
                    data.agents,
                    null,
                    2
                )

            // DAG
            if (data.dag && data.dag.trim()) {
                const dagEl = document.getElementById("dag")
                dagEl.textContent = data.dag
                dagEl.removeAttribute("data-processed")
                if (window.mermaid) {
                    window.mermaid.init(undefined, dagEl)
                }
            }

            // Timeline
            if (data.timeline && data.timeline.length > 0) {
                const timelineEl = document.getElementById("timeline")
                timelineEl.innerHTML = data.timeline.map(
                    t => `<div class="timeline-item">
                        <span class="${t.event}">${t.agent} ${t.event}</span>
                    </div>`
                ).join("")
            }
        }

        async function updateHistory() {

            const res = await fetch(
                "http://127.0.0.1:8000/history"
            )

            const data = await res.json()

            document.getElementById(
                "history"
            ).innerText =
                JSON.stringify(
                    data,
                    null,
                    2
                )
        }

        setInterval(updateDashboard, 1000)
        setInterval(updateHistory, 1000)

    </script>

</body>

</html>
