<!DOCTYPE html>
<html>

<head>

    <title>OmniResearch Dashboard</title>

    <style>

        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        #logs {
            height: 400px;
            overflow-y: scroll;
            background: black;
            padding: 10px;
        }

    </style>

</head>

<body>

    <h1>OmniResearch Dashboard</h1>

    <div class="card">

        <h2>Runtime Metrics</h2>

        <p id="totalTasks"></p>

        <p id="completedTasks"></p>

        <p id="runningTasks"></p>

        <p id="tokenUsage"></p>

    </div>

    <div class="card">

        <h2>Agent Status</h2>

        <pre id="agents"></pre>

    </div>

    <div class="card">

        <h2>Live Logs</h2>

        <div id="logs"></div>

    </div>

    <script>

        const logs = document.getElementById("logs")

        const ws = new WebSocket(
            "ws://127.0.0.1:8000/ws/logs"
        )

        ws.onmessage = (event) => {

            const div = document.createElement("div")

            div.innerText = event.data

            logs.appendChild(div)

            logs.scrollTop = logs.scrollHeight
        }

        async function updateDashboard() {

            const res = await fetch(
                "http://127.0.0.1:8000/dashboard"
            )

            const data = await res.json()

            document.getElementById(
                "totalTasks"
            ).innerText =
                "Total Tasks: " + data.total_tasks

            document.getElementById(
                "completedTasks"
            ).innerText =
                "Completed: " + data.completed_tasks

            document.getElementById(
                "runningTasks"
            ).innerText =
                "Running: " + data.running_tasks

            document.getElementById(
                "tokenUsage"
            ).innerText =
                "Tokens: " + data.token_usage

            document.getElementById(
                "agents"
            ).innerText =
                JSON.stringify(
                    data.agents,
                    null,
                    2
                )
        }

        setInterval(
            updateDashboard,
            1000
        )

    </script>

</body>

</html>
